name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pin the declared minimum torch so the detection baselines reproduce exactly
        pip install "torch==2.2.2" "torchvision==0.17.2"
        pip install -e . pytest ruff

    - name: Lint
      # the full rule set has pre-existing violations; gate on syntax errors and
      # undefined names until the backlog is cleaned up
      run: ruff check --select E9,F821 yolox tests

    - name: Tests
      # test_training.py skips without CUDA; detection/onnx tests download
      # pretrained weights from GitHub releases on first run
      run: pytest tests/
